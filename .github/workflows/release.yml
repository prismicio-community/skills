name: Publish downloads

# Every push to main rebuilds the downloads and library.json and replaces the
# assets on one rolling GitHub release, so download URLs never change:
#   https://github.com/<owner>/<repo>/releases/download/<releaseTag>/<file>
# <releaseTag> comes from "library.releaseTag" in package.json.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-downloads
  cancel-in-progress: false

jobs:
  publish:
    name: Publish downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm run build

      - run: npm run verify

      - name: Upload to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # With no plugins or prompts yet, the dist/<folder>/* globs expand to nothing.
          shopt -s nullglob
          TAG=$(node -p "require('./package.json').library.releaseTag")

          # Point the tag at this commit.
          git tag --force "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Library downloads" --notes "Downloads for the Prismic AI library." --latest
          fi

          gh release upload "$TAG" dist/library.json dist/plugins/* dist/prompts/* --clobber

          # Remove downloads that are no longer built, such as removed plugins and prompts.
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            if [ ! -e "dist/$asset" ] && [ ! -e "dist/plugins/$asset" ] && [ ! -e "dist/prompts/$asset" ]; then
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done

          gh release edit "$TAG" --notes "Downloads for the Prismic AI library, built from $GITHUB_SHA. Rebuilt on every change to main."

      # Tell the website to drop its cached library.json. Without this, it serves
      # the old one for up to an hour. This runs after the upload so the website
      # fetches the new file. A failure only warns: the downloads are already
      # published, and the cache expires on its own.
      - name: Refresh the website
        env:
          REVALIDATE_SECRET: ${{ secrets.WORKFLOW_LIBRARY_REVALIDATE_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning title=Website not refreshed::The WORKFLOW_LIBRARY_REVALIDATE_SECRET secret isn't set."
            exit 0
          fi
          if ! curl --fail-with-body --silent --show-error --max-time 30 --retry 3 \
            -X POST https://prismic.io/api/revalidate-workflow-library \
            -H "Authorization: Bearer $REVALIDATE_SECRET"; then
            echo "::warning title=Website not refreshed::The revalidate request failed. The website shows the new library within an hour."
          fi
